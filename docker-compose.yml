services:
  postgres:
    image: postgres:16-alpine
    container_name: catdef-postgres
    environment:
      POSTGRES_USER: catdef
      POSTGRES_PASSWORD: catdef
      POSTGRES_DB: catdef
    ports:
      - "5432:5432"
    volumes:
      - catdef-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catdef"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: catdef-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  catdef-pgdata:
